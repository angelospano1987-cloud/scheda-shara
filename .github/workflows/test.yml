name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintassi dei file dell'app
        run: for f in core.js app.js sw.js config.js push-worker/src/*.js; do node --check "$f" || exit 1; done
      - name: Test
        run: node --test "tests/*.test.mjs"
